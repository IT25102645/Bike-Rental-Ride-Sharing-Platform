<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome | Dilshan's Bike Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('https://images.unsplash.com/photo-1558981403-c5f91cbba527?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-attachment: fixed; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif;
        }
        .hero-section {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 30px;
            padding: 60px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); color: white;
            max-width: 900px; text-align: center;
        }
        .nav-card {
            background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 25px;
            transition: 0.4s; text-decoration: none; color: #333; display: block;
            border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .nav-card:hover { transform: translateY(-10px); background: #fff; color: #000; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .nav-card i { font-size: 2.5rem; color: #3a7bd5; display: block; margin-bottom: 15px; }
        .hero-title { font-weight: 800; font-size: 3.5rem; letter-spacing: 2px; }
    </style>
</head>
<body>
<div class="hero-section animate__animated animate__fadeIn">
    <h1 class="hero-title animate__animated animate__zoomIn">BIKE RENTAL <span style="color: #00d2ff;">PORTAL</span></h1>
    <p class="lead mb-5">Manage your premium bike fleet with efficiency and style.</p>

    <div class="row g-4 justify-content-center">
        <div class="col-md-3">
            <a href="/bikes" class="nav-card animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
                <span>🚲</span>
                <h6 class="fw-bold mt-2">View Fleet</h6>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/add-bike" class="nav-card animate__animated animate__fadeInUp" style="animation-delay: 0.4s;">
                <span>➕</span>
                <h6 class="fw-bold mt-2">Add Bike</h6>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/search" class="nav-card animate__animated animate__fadeInUp" style="animation-delay: 0.6s;">
                <span>🔍</span>
                <h6 class="fw-bold mt-2">Search</h6>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/bikes" class="nav-card animate__animated animate__fadeInUp" style="animation-delay: 0.8s;">
                <span>⚙️</span>
                <h6 class="fw-bold mt-2">Manage Bikes</h6>
            </a>
        </div>
    </div>
</div>
</body>
</html>
