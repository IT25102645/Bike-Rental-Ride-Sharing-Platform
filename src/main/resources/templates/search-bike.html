<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Search Fleet | dilshan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
    body { background: #0f2027; background: linear-gradient(to right, #2c5364, #203a43, #0f2027); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .search-bar { background: rgba(255,255,255,0.1); border: 2px solid #3a7bd5; border-radius: 50px; padding: 15px 30px; color: white; font-size: 1.2rem; }
  </style>
</head>
<body>
<div class="container text-center animate__animated animate__fadeIn">
  <h1 class="display-3 mb-4 fw-bold">🔍 Quick Find</h1>
  <p class="mb-5 text-info">Instant results from our inventory</p>
  <div class="input-group mb-4 px-3 w-75 mx-auto">
    <input type="text" class="form-control search-bar" placeholder="Enter Bike ID here...">
    <button class="btn btn-primary px-4 rounded-pill ms-2 shadow fw-bold">SEARCH</button>
  </div>
  <a href="/bikes" class="btn btn-outline-light rounded-pill px-4">Back to Dashboard</a>
</div>
</body>
</html>
