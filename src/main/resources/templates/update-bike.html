<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Bike | Update Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; min-height: 100vh; display: flex; align-items: center;
        }
        .glass-box { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 40px; color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-update { background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%); border: none; }

        .form-select.bg-transparent option { background: #333; color: white; }
    </style>
</head>
<body class="container">
<div class="row justify-content-center w-100">
    <div class="col-md-5 glass-box animate__animated animate__zoomIn text-center">
        <h3 class="mb-4">⚙️ Edit Bike Details</h3>
        <form action="/update-bike" method="post">
            <div class="mb-3">
                <label class="form-label d-block">Bike ID</label>
                <input type="text" name="id" th:value="${bike.bikeID}" class="form-control bg-transparent text-white border-white" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Model Name</label>
                <input type="text" name="model" th:value="${bike.model}" class="form-control bg-transparent text-white border-white" required>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Price (Per Hour)</label>
                <input type="number" step="0.01" name="price" th:value="${bike.pricePerHour}" class="form-control bg-transparent text-white border-white" required>
            </div>

            <div class="mb-4">
                <label class="form-label d-block">Availability Status</label>
                <select name="isAvailable" class="form-select bg-transparent text-white border-white">
                    <option value="true" th:selected="${bike.isAvailable}">Available</option>
                    <option value="false" th:selected="${!bike.isAvailable}">Not Available</option>
                </select>
            </div>

            <button type="submit" class="btn btn-update w-100 py-2 fw-bold text-white shadow">SAVE CHANGES</button>
            <a href="/bikes" class="btn btn-link text-white mt-3 text-decoration-none small">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
