<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Review</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Submit a Review</h1>
    <div class="form-card">
        <div class="form-group">
            <label>Review Type</label>
            <select id="reviewType" onchange="toggleFields()">
                <option value="BIKE">Bike Review</option>
                <option value="RIDE">Ride Review</option>
            </select>
        </div>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        <div id="bikeFields">
            <div class="form-group">
                <label>Bike Model</label>
                <input type="text" id="bikeModel" placeholder="e.g. Trek FX3">
            </div>
            <div class="form-group">
                <label>Bike ID</label>
                <input type="text" id="bikeId" placeholder="e.g. BK001">
            </div>
        </div>
        <div id="rideFields" style="display:none">
            <div class="form-group">
                <label>Route Name</label>
                <input type="text" id="routeName" placeholder="e.g. City Loop">
            </div>
            <div class="form-group">
                <label>Ride ID</label>
                <input type="text" id="rideId" placeholder="e.g. RD001">
            </div>
        </div>
        <div class="form-group">
            <label>Rating</label>
            <div class="star-rating" id="starRating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <input type="hidden" id="rating" value="0">
        </div>
        <div class="form-group">
            <label>Comment</label>
            <textarea id="comment" rows="4"
                      placeholder="Share your experience..."></textarea>
        </div>
        <button class="btn-primary" onclick="submitReview()">Submit Review</button>
        <div id="message" class="message"></div>
    </div>
</div>
<script src="/css/submit_review.js"></script>
</body>
</html>
