<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin — Manage Reviews</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Admin: Review Management</h1>
    <div id="adminList" class="admin-table-wrap">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Type</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>
    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>Edit Review</h2>
            <input type="hidden" id="editReviewId">
            <div class="form-group">
                <label>New Rating (1-5)</label>
                <input type="number" id="editRating" min="1" max="5">
            </div>
            <div class="form-group">
                <label>New Comment</label>
                <textarea id="editComment" rows="3"></textarea>
            </div>
            <button class="btn-primary" onclick="saveEdit()">Save</button>
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>
<script src="/js/admin_reviews.js"></script>
</body>
</html>
