<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bike Catalog | Dilshan's Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
            url('https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-attachment: fixed; min-height: 100vh; font-family: 'Poppins', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); margin-top: 50px;
        }
        .bike-card {
            background: rgba(255, 255, 255, 0.9); border: none; border-radius: 20px; transition: 0.4s;
        }
        .bike-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .header-title { color: #ffffff; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); font-weight: 800; }
        .btn-add { background: #ff4757; border: none; color: white; border-radius: 50px; font-weight: bold; text-decoration: none; display: inline-block; }
    </style>
</head>
<body class="py-5">
<div class="container glass-panel animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="header-title animate__animated animate__slideInLeft">🚲 Premium Bike Fleet</h1>
        <div>
            <a href="/" class="btn btn-outline-light rounded-pill me-2">Home</a>
            <a href="/add-bike" class="btn btn-add px-4 py-2 shadow-lg animate__animated animate__slideInRight">Add New Bike</a>
        </div>
    </div>

    <div class="row g-4">
        <div th:each="bike : ${bikes}" class="col-lg-4 col-md-6 animate__animated animate__zoomIn">
            <div class="card bike-card h-100 p-3 text-center shadow">

                <div class="mb-3 d-flex justify-content-center align-items-center" style="height: 100px;">
                    <img th:src="${bike.class.simpleName == 'ElectricBike'} ? 'https://img.icons8.com/fluency/96/electric-bike.png' : 'https://img.icons8.com/fluency/96/bicycle.png'"
                         alt="Bike Icon" style="width: 80px;">
                </div>

                <h4 class="fw-bold text-dark mb-1" th:text="${bike.model}">Model</h4>
                <p class="text-muted small mb-2" th:text="'ID: ' + ${bike.bikeID}">ID</p>
                <h5 class="text-primary fw-bold" th:text="'Rs.' + ${bike.pricePerHour} + '/hr'">Price</h5>

                <p class="small text-secondary mb-2">
                    <span th:if="${bike.class.simpleName == 'ElectricBike'}" th:text="'Battery: ' + ${bike.batteryCapacity} + ' Ah'"></span>
                    <span th:if="${bike.class.simpleName == 'ManualBike'}" th:text="'Gears: ' + ${bike.numberOfGears}"></span>
                </p>

                <div class="mt-2">
                    <span th:class="${bike.isAvailable ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${bike.isAvailable ? 'Available' : 'Occupied'}"></span>
                </div>

                <div class="mt-4">
                    <a th:href="@{/delete/{id}(id=${bike.bikeID})}" class="btn btn-sm btn-outline-danger px-4 rounded-pill">Remove Bike</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(bikes)}" class="text-center text-white mt-5">
        <p class="lead">No bikes registered in the system yet.</p>
    </div>
</div>
</body>
</html>
